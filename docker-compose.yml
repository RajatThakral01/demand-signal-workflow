# Local-only deployment shape (PRD §6): one FastAPI app service + one Postgres.
# No message broker, no paid service (PRD §2 / Appendix). The app talks to the
# `db` service over an internal Docker network.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dsw
      # LOCAL-ONLY disposable dev credential. Overridable via .env (DB *should*
      # come through DATABASE_URL app-side, but Postgres itself needs these).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dsw_local_dev}
      POSTGRES_DB: dsw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsw -d dsw"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # On first init this creates `dsw_test` alongside `dsw` so the test suite
      # never shares (and never wipes) the app's dev database.
      - ./docker/init:/docker-entrypoint-initdb.d:ro

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # In-compose default points at the `db` service. Overridable via .env.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://dsw:dsw_local_dev@db:5432/dsw}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # CLASSIFICATION_MODEL pinned to DeepSeek V4 Flash via OpenRouter (much
      # cheaper than the PRD example anthropic/claude-haiku-4.5 for test runs).
      # Deliberate deviation disclosed in AI_USAGE.md; FR-4 is model-agnostic.
      CLASSIFICATION_MODEL: ${CLASSIFICATION_MODEL:-deepseek/deepseek-v4-flash}
      # ADMIN_API_KEY is intentionally REQUIRED via .env with NO fallback — the
      # only runtime auth gate must not silently accept a hardcoded value. If
      # unset, config.py fails fast at import (see app/config.py).
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      SCORING_POLICY_VERSION: ${SCORING_POLICY_VERSION:-scoring_policy_v1.json}
      IDENTITY_POLICY_VERSION: ${IDENTITY_POLICY_VERSION:-identity_policy_v1.json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ENV: ${APP_ENV:-local}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_BASE_DELAY_MS: ${RETRY_BASE_DELAY_MS:-500}
      # Tests run against an isolated database (created by docker/init on first
      # boot) so the suite's drop_all/create_all never touches dev data.
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+asyncpg://dsw:dsw_local_dev@db:5432/dsw_test}
    ports:
      - "8000:8000"

volumes:
  pgdata: