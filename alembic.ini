# Alembic configuration. The DB URL is supplied at runtime by
# app/db/migrations/env.py (from settings.DATABASE_URL), so no URL is hardcoded
# here even in the usual `sqlalchemy.url` slot.

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
# Alembic requires this key to exist; env.py overrides it with the real URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S